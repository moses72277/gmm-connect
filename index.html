<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GMM Connect</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

.app {
  max-width: 500px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

/* HEADER */
.header {
  padding: 18px;
  background: #1877f2;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.header-icons {
  font-size: 22px;
}

/* WELCOME */
.welcome {
  padding: 35px 20px;
  text-align: center;
}

.welcome h1 {
  color: #1877f2;
  margin-bottom: 10px;
}

.welcome p {
  color: #666;
  margin-bottom: 25px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #1877f2;
  color: white;
}

/* POSTS */
.post {
  margin: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: white;
}

.user {
  font-weight: bold;
  margin-bottom: 10px;
}

.post-text {
  margin-bottom: 15px;
  line-height: 1.5;
}

.actions {
  display: flex;
  gap: 10px;
}

.action {
  background: #f0f2f5;
  flex: 1;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  max-width: 500px;
  width: 100%;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  padding: 12px 5px;
}

.nav-item {
  text-align: center;
  color: #666;
  font-size: 13px;
}

.nav-item span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #1877f2;
}

.content {
  padding-bottom: 80px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">GMM Connect</div>
    <div class="header-icons">🔔</div>
  </div>

  <div class="content">

    <div class="welcome">
      <h1>Welcome to GMM Connect</h1>
      <p>Connect. Chat. Share. Discover.</p>
      <button class="primary" onclick="startApp()">
        Get Started
      </button>
    </div>

    <div class="post">
      <div class="user">👤 GMM Connect</div>

      <div class="post-text">
        Welcome to GMM Connect! 🎉
        Connect with friends and meet new people.
      </div>

      <div class="actions">
        <button class="action" onclick="likePost(this)">
          👍 Like
        </button>

        <button class="action" onclick="openChat()">
          💬 Chat
        </button>

        <button class="action">
          ↗ Share
        </button>
      </div>
    </div>

  </div>

  <div class="bottom-nav">

    <div class="nav-item active">
      <span>🏠</span>
      Home
    </div>

    <div class="nav-item" onclick="openChat()">
      <span>💬</span>
      Chat
    </div>

    <div class="nav-item">
      <span>➕</span>
      Post
    </div>

    <div class="nav-item">
      <span>👥</span>
      Friends
    </div>

    <div class="nav-item">
      <span>👤</span>
      Profile
    </div>

  </div>

</div>

<script>

function startApp() {
  alert("Welcome to GMM Connect!");
}

function likePost(button) {
  button.innerHTML = "❤️ Liked";
}

function openChat() {
  alert("Chat section coming next!");
}

</script>

</body>
</html>
