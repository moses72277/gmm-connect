<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMM V14 Real Friends</title>
<link rel="manifest" href='data:application/json;charset=utf-8,{"name":"GMM V14","short_name":"GMM","display":"standalone","theme_color":"#1877f2"}'>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1877f2,#0a3d91);padding:20px}
.loginBox{background:#fff;color:#000;max-width:400px;width:100%;border-radius:16px;padding:24px}
.loginBox h1{color:#1877f2;text-align:center;font-size:28px}.loginBox p{color:#666}
.loginBox input{width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;background:#f0f2f5;margin-bottom:10px;outline:none}
.btn{width:100%;padding:13px;background:#1877f2;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:6px}
.btn2{background:#42b72a}.link{color:#1877f2;text-align:center;margin-top:12px;font-size:14px;cursor:pointer}
#app{display:none;max-width:500px;margin:0 auto;background:#000;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.logo{font-weight:900;color:#fff;font-size:19px}.iconBtn{width:36px;height:36px;border-radius:50%;background:#222;border:none;font-size:16px;cursor:pointer;color:#fff}
.installBar{background:#1877f2;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:#000;border-bottom:1px solid #222;position:sticky;top:48px;z-index:10}.tab{flex:1;text-align:center;padding:12px;font-weight:700;color:#777;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:#fff;border-color:#fff}
.post{background:#111;border-radius:12px;margin:12px 8px;overflow:hidden;border:1px solid #222}
.postHead{padding:10px;display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.postMedia img{width:100%;display:block}.postMedia video{width:100%;display:block;background:#000}
.postText{padding:10px 12px;font-size:15px;line-height:1.3}
.postActions{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid #222}.act{padding:6px 12px;background:#222;border-radius:20px;font-size:13px;cursor:pointer}
.composer{background:#111;padding:10px;margin:8px;border-radius:10px;display:flex;gap:10px;align-items:center;border:1px solid #222}
.composer input{flex:1;background:#222;border:none;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.userRow{display:flex;gap:12px;padding:12px;background:#111;margin-bottom:1px;align-items:center;cursor:pointer;border-bottom:1px solid #222}
.searchBox{padding:8px;background:#000;position:sticky;top:0;z-index:5}.searchBox input{width:100%;background:#222;border:none;border-radius:20px;padding:12px 14px;color:#fff;outline:none}
.view{display:none}.view.active{display:block}
#chatWindow{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:78vh;background:#111;z-index:50;border-radius:16px 16px 0 0;display:none;flex-direction:column;border:1px solid #333}
#chatWindow.open{display:flex}.chatBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:72%;padding:8px 12px;border-radius:18px;font-size:14px}.me{align-self:flex-end;background:#1877f2;color:#fff}.them{align-self:flex-start;background:#222;color:#fff}
.chatInput{display:flex;gap:8px;padding:10px;border-top:1px solid #333}.chatInput input{flex:1;background:#222;border:none;border-radius:20px;padding:10px;color:#fff}
.stories{display:flex;gap:8px;padding:12px 8px;overflow-x:auto;border-bottom:1px solid #222}.story{min-width:100px;height:170px;border-radius:12px;background-size:cover;flex-shrink:0;background-color:#222}
</style></head><body>
<div id="loginPage"><div class="loginBox" id="loginBox">
<h1>gmmconnect V14</h1><p style="text-align:center;font-size:12px;margin:6px 0 14px">Real Accounts • Search Friends • Private Chat</p>
<div id="loginForm">
<input id="loginEmail" placeholder="Email address"><input id="loginPass" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">Log In</button>
<div class="link" onclick="showSignup()">Create New Account</div>
</div>
<div id="signupForm" style="display:none">
<input id="suName" placeholder="Full Name e.g Moses Joseph"><input id="suEmail" placeholder="Email address"><input id="suPass" type="password" placeholder="New Password"><input id="suDept" placeholder="Department e.g ND1 Computer Science">
<button class="btn btn2" onclick="doSignup()">Sign Up</button>
<div class="link" onclick="showLogin()">Already have account?</div>
</div>
<p id="authMsg" style="font-size:12px;color:red;text-align:center;margin-top:10px"></p>
</div></div>

<div id="app">
<div id="installBar" class="installBar"><span>📱 Install GMM App?</span><button class="btn" style="width:auto;padding:6px 12px;background:#fff;color:#1877f2;border-radius:20px" onclick="installApp()">Install</button></div>
<header><div class="logo">gmmconnect V14</div><div style="display:flex;gap:6px"><button class="iconBtn" onclick="switchTab('feed')">🏠</button><button class="iconBtn" onclick="switchTab('messages')">💬</button><button class="iconBtn" onclick="document.getElementById('filePick').click()">📷</button><button class="iconBtn" onclick="doLogout()">🚪</button></div></header>
<div class="tabs"><div id="tab-feed" class="tab active" onclick="switchTab('feed')">For You 🔥</div><div id="tab-messages" class="tab" onclick="switchTab('messages')">Messages</div></div>
<div id="view-feed" class="view active">
<div class="stories"><div class="story" style="background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:30px">+</div><span style="font-size:11px">Create story</span></div><div class="story" style="background-image:linear-gradient(180deg,transparent,#000), url('https://picsum.photos/seed/fun1/200/300')"></div><div class="story" style="background-image:linear-gradient(180deg,transparent,#000), url('https://picsum.photos/seed/fun2/200/300')"></div></div>
<div class="composer"><div class="avatar" id="myAv">S</div><input id="postInput" placeholder="What's funny?"><input type="file" id="filePick" accept="image/*,video/*" style="display:none"><button onclick="makePost()" style="background:#1877f2;color:#fff;border:none;border-radius:20px;padding:8px 14px">Post</button></div>
<div id="feed"></div>
</div>
<div id="view-messages" class="view">
<div class="searchBox"><input id="searchInput" placeholder="🔍 Search friends by name..." oninput="searchUsers()"></div>
<div id="userList"></div>
</div>
</div>
<div id="chatWindow"><div style="padding:12px;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px"><div class="avatar" id="chatAv">U</div><b id="chatName" style="flex:1">Name</b><button class="iconBtn" onclick="closeChat()">✕</button></div><div id="chatBody" class="chatBody"></div><div class="chatInput"><input id="chatInput" placeholder="Aa" onkeypress="if(event.key==='Enter')sendMsg()"><button class="iconBtn" style="background:#1877f2" onclick="sendMsg()">➤</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5CE1LNky6HkqDn4uLHPVScILlz-NPIws",
  authDomain: "gmmconnect01.firebaseapp.com",
  databaseURL: "https://gmmconnect01-default-rtdb.firebaseio.com",
  projectId: "gmmconnect01",
  storageBucket: "gmmconnect01.firebasestorage.app",
  messagingSenderId: "1079348259443",
  appId: "1:1079348259443:web:d277772f63b980f8fc9806"
};
const appFB = initializeApp(firebaseConfig);
const auth = getAuth(appFB);
const db = getFirestore(appFB);

let me=null, activeChat=null, allUsers=[], pendingMedia=null;
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;});
window.installApp=()=>{if(deferredPrompt){deferredPrompt.prompt();}else{alert('Android: 3 dots → Add to Home Screen\n iPhone: Share → Add to Home Screen');}}

window.showSignup=()=>{document.getElementById('loginForm').style.display='none';document.getElementById('signupForm').style.display='block';}
window.showLogin=()=>{document.getElementById('signupForm').style.display='none';document.getElementById('loginForm').style.display='block';}

window.doSignup=async()=>{
  const name=document.getElementById('suName').value.trim();
  const email=document.getElementById('suEmail').value.trim();
  const pass=document.getElementById('suPass').value.trim();
  const dept=document.getElementById('suDept').value.trim();
  const msg=document.getElementById('authMsg');
  if(!name||!email||!pass){msg.textContent='Fill all fields brr';return;}
  msg.textContent='Creating account...';
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name:name,email:email,dept:dept||'GMM',initial:name[0].toUpperCase(),created:serverTimestamp()});
    msg.textContent='Account created! Loading...';
  }catch(e){msg.textContent=e.message;}
}
window.doLogin=async()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value.trim();
  const msg=document.getElementById('authMsg');
  if(!email||!pass){msg.textContent='Enter email & password';return;}
  msg.textContent='Logging in...';
  try{await signInWithEmailAndPassword(auth,email,pass);}catch(e){msg.textContent=e.message;}
}
window.doLogout=()=>signOut(auth);

onAuthStateChanged(auth, async(user)=>{
  if(user){
    const snap=await getDoc(doc(db,'users',user.uid));
    me=snap.exists()?snap.data():{uid:user.uid,name:user.displayName||user.email,initial:(user.displayName||'U')[0].toUpperCase()};
    document.getElementById('loginPage').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('myAv').textContent=me.initial;
    loadUsers(); renderFeed();
  }else{
    document.getElementById('loginPage').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

async function loadUsers(){
  onSnapshot(collection(db,'users'), (s)=>{
    allUsers=[]; s.forEach(d=>{if(d.id!==me.uid) allUsers.push(d.data());});
    renderUserList(allUsers);
  });
}
window.renderUserList=(list)=>{
  document.getElementById('userList').innerHTML=list.map(u=>`
    <div class="userRow" onclick="openChat('${u.uid}','${u.name.replace(/'/g,"")}','${u.initial}')">
      <div class="avatar">${u.initial}</div>
      <div><b>${u.name}</b><div style="font-size:11px;color:#777">${u.dept||'Online'} • Tap to chat</div></div>
      <div style="margin-left:auto">💬</div>
    </div>`).join('') || '<div style="text-align:center;color:#777;padding:20px">No friends yet. Tell friends to create account!</div>';
}
window.searchUsers=()=>{
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=allUsers.filter(u=>u.name.toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
  renderUserList(filtered);
}

const FUNNY_POSTS=[
{name:'Meme Lord 😂',initial:'😂',text:'POV: You said you will read overnight but sleep carry you 😭💀',media:'https://picsum.photos/seed/meme1/600/600',type:'image'},
{name:'Funny Videos NG',initial:'🎥',text:'This dog get more rizz than me 😂🔥',media:'https://www.w3schools.com/html/mov_bbb.mp4',type:'video'},
{name:'Campus Wahala',initial:'🤣',text:'ND1 lecturer: "This question is simple"',media:'https://picsum.photos/seed/meme2/600/750',type:'image'},
{name:'Gist Lover',initial:'👀',text:'When you borrow your friend money and he post new shoe 💀',media:'https://picsum.photos/seed/meme3/600/500',type:'image'},
];
let userPosts=JSON.parse(localStorage.getItem('gmm_v14_posts')||'[]');
function renderFeed(){
  const all=[...userPosts,...FUNNY_POSTS];
  document.getElementById('feed').innerHTML=all.map(p=>`
  <div class="post"><div class="postHead"><div class="avatar">${p.initial||'F'}</div><div><b style="font-size:14px">${p.name}</b><br><span style="font-size:11px;color:#777">Just now • Funny</span></div></div>
  <div class="postText">${p.text}</div>
  ${p.media?`<div class="postMedia">${p.type==='video'?`<video src="${p.media}" controls playsinline loop></video>`:`<img src="${p.media}" loading="lazy">`}</div>`:''}
  <div class="postActions"><div class="act">❤️ Like</div><div class="act">💬 Comment</div><div class="act">↗️ Share</div></div></div>`).join('');
}
window.makePost=()=>{
  const txt=document.getElementById('postInput').value.trim(); if(!txt &&!pendingMedia) return;
  const p={name:me.name,initial:me.initial,text:txt||'Funny af 😂',media:pendingMedia?.url,type:pendingMedia?.type};
  userPosts.unshift(p); localStorage.setItem('gmm_v14_posts',JSON.stringify(userPosts)); document.getElementById('postInput').value=''; pendingMedia=null; renderFeed();
}
document.getElementById('filePick').addEventListener('change', function(){
  const f=this.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{pendingMedia={url:e.target.result,type:f.type.startsWith('video')?'video':'image'}; makePost();}; r.readAsDataURL(f);
});

window.switchTab=(t)=>{document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.getElementById('view-'+t).classList.add('active');}

// CHAT WITH FIREBASE
let unsubChat=null;
window.openChat=(uid,name,initial)=>{
  activeChat=uid;
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatAv').textContent=initial;
  document.getElementById('chatWindow').classList.add('open');
  const chatId=[me.uid,uid].sort().join('__');
  const q=query(collection(db,'chats',chatId,'messages'), orderBy('time','asc'));
  if(unsubChat) unsubChat();
  unsubChat=onSnapshot(q,(snap)=>{
    const body=document.getElementById('chatBody');
    body.innerHTML=snap.docs.map(d=>{const m=d.data(); return `<div class="bubble ${m.from===me.uid?'me':'them'}">${m.text}</div>`;}).join('') || '<div style="text-align:center;color:#555;padding:20px">Start chat with '+name+' 💬</div>';
    body.scrollTop=body.scrollHeight;
  });
}
window.closeChat=()=>{document.getElementById('chatWindow').classList.remove('open'); if(unsubChat){unsubChat(); unsubChat=null;} activeChat=null;}
window.sendMsg=async()=>{
  const inp=document.getElementById('chatInput'); if(!inp.value.trim()||!activeChat) return;
  const chatId=[me.uid,activeChat].sort().join('__');
  const text=inp.value; inp.value='';
  await addDoc(collection(db,'chats',chatId,'messages'),{text:text,from:me.uid,to:activeChat,time:serverTimestamp(),fromName:me.name});
  // also update last message
  await setDoc(doc(db,'chats',chatId),{users:[me.uid,activeChat],lastMsg:text,updated:serverTimestamp()},{merge:true});
}
</script>
</body></html>
