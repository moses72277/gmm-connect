<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMM Connect</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1877f2">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;box-shadow:0 2px 5px rgba(0,0,0,0.1);z-index:10}
.logo{color:#1877f2;font-weight:900;font-size:24px}
.nav a{margin-left:12px;text-decoration:none;background:#e4e6eb;padding:8px 14px;border-radius:20px;color:black;font-weight:600}
.nav a.active{background:#1877f2;color:white}
.create-box{background:white;margin:15px;border-radius:10px;padding:12px;display:flex;align-items:center}
.create-box img{width:40px;height:40px;border-radius:50%;margin-right:10px}
.create-box input{flex:1;background:#f0f2f5;border:none;padding:10px 15px;border-radius:20px;outline:none}
.post{background:white;margin:15px;border-radius:10px;padding:12px}
.post-head{display:flex;align-items:center;margin-bottom:10px}
.post-head img{width:40px;height:40px;border-radius:50%;margin-right:10px}
.post-actions{display:flex;justify-content:space-around;border-top:1px solid #ddd;padding-top:8px;margin-top:10px}
.post-actions button{border:none;background:none;font-weight:600;color:#65676b;cursor:pointer}
#loginDiv{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#f0f2f5}
.login-card{background:white;padding:30px;border-radius:10px;text-align:center;width:90%;max-width:350px}
.login-card h1{color:#1877f2;font-size:40px;margin-bottom:10px}
.login-card button{background:#1877f2;color:white;border:none;padding:12px 20px;border-radius:6px;width:100%;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer}
</style>
</head>
<body>
<div id="loginDiv">
  <div class="login-card">
    <h1>gmmconnect</h1>
    <p>Connect with friends on GMM Connect</p>
    <button id="loginBtn">Continue with Google</button>
    <p style="font-size:12px;margin-top:15px;color:gray">Built by Moses in Lagos 🇳🇬</p>
  </div>
</div>
<div id="appDiv" style="display:none">
  <div class="header">
    <div class="logo">gmmconnect</div>
    <div class="nav">
      <a class="active" href="index.html">🏠</a>
      <a href="chat.html">💬 Chat</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>
  <div class="create-box">
    <img id="userPic" src="">
    <input id="postInput" placeholder="What's on your mind?">
    <button id="postBtn" style="margin-left:10px;background:#1877f2;color:white;border:none;padding:8px 15px;border-radius:20px;font-weight:bold">Post</button>
  </div>
  <div id="feed"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyD-EXAMPLE-REPLACE-WITH-YOURS",
  authDomain: "gmmconnect01.firebaseapp.com",
  projectId: "gmmconnect01",
  storageBucket: "gmmconnect01.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const loginDiv = document.getElementById("loginDiv");
const appDiv = document.getElementById("appDiv");
document.getElementById("loginBtn").onclick = async ()=>{ try{ await signInWithPopup(auth, provider);}catch(e){alert(e.message);} };
document.getElementById("logoutBtn").onclick = ()=> signOut(auth);
onAuthStateChanged(auth, (user)=>{
  if(user){ loginDiv.style.display="none"; appDiv.style.display="block"; document.getElementById("userPic").src = user.photoURL; loadFeed(user); }
  else{ loginDiv.style.display="flex"; appDiv.style.display="none"; }
});
document.getElementById("postBtn").onclick = async ()=>{
  const text = document.getElementById("postInput").value; if(!text) return;
  const user = auth.currentUser;
  await addDoc(collection(db, "posts"), { text, name: user.displayName, photo: user.photoURL, uid: user.uid, likes: [], time: serverTimestamp() });
  document.getElementById("postInput").value="";
};
function loadFeed(currentUser){
  const q = query(collection(db, "posts"), orderBy("time","desc"));
  onSnapshot(q, (snap)=>{
    const feed = document.getElementById("feed"); feed.innerHTML="";
    snap.forEach(d=>{
      const post = d.data(); const id = d.id; const liked = post.likes?.includes(currentUser.uid);
      feed.innerHTML += `<div class="post"><div class="post-head"><img src="${post.photo}"><div><b>${post.name}</b><br><small style="color:gray">Just now • 🌍</small></div></div><div>${post.text}</div><div style="color:gray;font-size:14px;margin-top:5px">${post.likes?.length||0} likes</div><div class="post-actions"><button onclick="likePost('${id}','${currentUser.uid}')" style="color:${liked?'#1877f2':''}">${liked?'💙 Liked':'👍 Like'}</button><button>💬 Comment</button><button>↗️ Share</button></div></div>`;
    });
  });
}
window.likePost = async (postId, uid)=>{
  const ref = doc(db, "posts", postId); const snap = await getDoc(ref);
  try{ const data = snap.data(); if(data.likes?.includes(uid)){ await updateDoc(ref, {likes: arrayRemove(uid)}); }else{ await updateDoc(ref, {likes: arrayUnion(uid)}); } }catch(e){}
};
</script>
</body>
</html>
